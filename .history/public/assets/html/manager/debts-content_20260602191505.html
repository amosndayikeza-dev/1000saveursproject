<div class="debts-container">
    <div class="mgr-toolbar">
        <div class="tft-form-group">
            <input type="text" id="debts-search" placeholder="Rechercher un débiteur..." class="tft-form-control">
        </div>
        <select id="debts-status-filter" class="tft-form-control" style="width: auto;">
            <option value="all">Tous les statuts</option>
            <option value="pending">En cours</option>
            <option value="paid">Soldées</option>
        </select>
    </div>
    <table class="tft-table">
        <thead>
            <tr class="tft-b-bottom-gris">
                <th>Débiteur</th>
                <th>Produit</th>
                <th>Montant total</th>
                <th>Déjà payé</th>
                <th>Reste à payer</th>
                <th>Échéance</th>
                <th>Statut</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="debts-table-body">
            <tr><td colspan="8" class="mgr-empty-hint">Chargement…</div></tr>
        </tbody>
    </table>
</div>
