<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs - Admin</title>
    <link rel="icon" href="../assets/images/icons/abonnes.png">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/tft-configStyles.css">
    <link rel="stylesheet" href="../assets/css/responsiveStyles.css">
    <link rel="stylesheet" href="../assets/fonts/feather/feather.css">
    <link rel="stylesheet" href="../assets/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/manager.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
    <div class="containerAll">
        <!-- Sidebar (identique au dashboard admin) -->
        <div class="containerLeft" id="container-left">
            <div class="tft-icon-round-petit tft-p-absolute tft-top-5 tft-right-10 tft-bg-black3" onclick="hideSidebar()" id="icon-sidebar">
                <i class="fas fa-arrow-right"></i>
            </div>
            <div class="c-left-header">
                <a href="./dashboard.html">
                    <div class="tft-logo-avatar tft-bdr-greensav-1">
                        <img src="../assets/images/icons/abonnes.png" alt="">
                    </div>
                </a>
                <div class="app-title">
                    <h1 class="app-name">1000<span>Saveurs</span></h1>
                    <p class="tft-title3">Administration</p>
                </div>
            </div>
            <div class="menu">
                <div class="c-left-menu">
                    <a href="./dashboard.html">
                        <div class="c-left-option">
                            <div class="tft-icon-round"><i class="fas fa-home"></i></div>
                            <p class="option-name">Dashboard</p>
                        </div>
                    </a>
                    <a href="./users.html">
                        <div class="c-left-option active">
                            <div class="tft-icon-round"><i class="fas fa-users"></i></div>
                            <p class="option-name">Utilisateurs</p>
                        </div>
                    </a>
                    <a href="./logs.html">
                        <div class="c-left-option">
                            <div class="tft-icon-round"><i class="fas fa-history"></i></div>
                            <p class="option-name">Logs</p>
                        </div>
                    </a>
                    <a href="./settings.html">
                        <div class="c-left-option">
                            <div class="tft-icon-round"><i class="fas fa-cog"></i></div>
                            <p class="option-name">Configuration</p>
                        </div>
                    </a>
                </div>
                <div class="user-option">
                    <div class="tft-avatar-profil-petit tft-bdr-orangesav-2 tft-cursor-pointer" onclick="showContainerRight()">
                        <img src="../assets/images/icons/femme.jpg" alt="">
                    </div>
                    <div class="user-infos">
                        <div class="user-name">
                            <h2 id="userName" class="tft-title4 tft-fw-600">Chargement</h2>
                            <p id="userRole" class="tft-sm-title1">Admin</p>
                        </div>
                        <div class="tft-icon-carre-moyen tft-bg-black3 tft-transition" onclick="deconnectionModal()">
                            <i class="fe fe-log-out tft-clr-red"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contenu principal -->
        <div class="containerCenter">
            <div class="c-center-header">
                <h2 class="tft-title1 tft-fw-600 tft-center tft-gap-10px">
                    <div class="tft-icon-carre tft-bdr-gris-1" onclick="showSidebar()">
                        <i class="fas fa-bars"></i>
                    </div>
                    Gestion des utilisateurs
                </h2>
                <div class="header-aside">
                    <button class="tft-btn tft-bg-greensav" onclick="openUserModal()">
                        <i class="fas fa-plus"></i> Ajouter
                    </button>
                </div>
            </div>
            <div class="c-center-body">
                <div class="mgr-toolbar">
                    <div class="tft-form-group">
                        <select id="filter-role" class="tft-form-control">
                            <option value="">Tous les rôles</option>
                            <option value="admin">Admin</option>
                            <option value="patron">Patron</option>
                            <option value="manager">Manager</option>
                        </select>
                    </div>
                    <div class="tft-form-group">
                        <select id="filter-active" class="tft-form-control">
                            <option value="">Tous</option>
                            <option value="1">Actifs</option>
                            <option value="0">Inactifs</option>
                        </select>
                    </div>
                    <button class="tft-btn tft-bg-gris" onclick="loadUsers()">
                        <i class="fas fa-filter"></i> Filtrer
                    </button>
                </div>

                <table class="tft-table">
                    <thead>
                        <tr class="tft-b-bottom-gris">
                            <th class="tft-title3">ID</th>
                            <th class="tft-title3">Nom</th>
                            <th class="tft-title3">Prénom</th>
                            <th class="tft-title3">Email</th>
                            <th class="tft-title3">Rôle</th>
                            <th class="tft-title3">Statut</th>
                            <th class="tft-title3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr><td colspan="7" class="mgr-empty-hint">Chargement...</div></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Partie droite (profil) -->
        <div class="containerRight tft-p-relative" id="container-right">
            <!-- contenu identique au dashboard admin -->
            <div class="tft-close-icon tft-p-absolute tft-top-15 tft-right-15 tft-hover-red" onclick="closeModalInfos()">
                <i class="fas fa-times tft-clr-white3"></i>
            </div>
            <div class="admin-profil">
                <div class="tft-avatar-profil-moyen2 tft-bdr-greensav-2">
                    <img src="../assets/images/user/femme.png">
                </div>
                <h4 class="tft-title4 tft-fw-600" id="profile-name">Chargement</h4>
                <p class="tft-sm-title1">Admin</p>
            </div>
            <!-- autres éléments de profil... -->
        </div>

        <!-- Popup de déconnexion -->
        <div class="tft-popup-modal tft-a-center" id="deconnection-modal">
            <div class="tft-popup-container-small tft-bg-black3 tft-p-relative">
                <div class="deconnection-actions">
                    <h3 class="tft-title1">Voulez-vous déconnecter ?</h3>
                    <div class="deconnection-options">
                        <a class="tft-btn tft-bg-red tft-clr-white" href="#" id="logoutyes">Oui</a>
                        <button class="tft-btn tft-bg-greensav tft-clr-white" onclick="closeModal()">Non</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modale d'ajout/modification -->
    <div id="user-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3 id="modal-title">Ajouter un utilisateur</h3>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="tft-form-group">
                    <label>Nom</label>
                    <input type="text" id="last-name" class="tft-form-control" required>
                </div>
                <div class="tft-form-group">
                    <label>Prénom</label>
                    <input type="text" id="first-name" class="tft-form-control" required>
                </div>
                <div class="tft-form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="tft-form-control" required>
                </div>
                <div class="tft-form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" class="tft-form-control" placeholder="Laisser vide pour ne pas changer">
                </div>
                <div class="tft-form-group">
                    <label>Rôle</label>
                    <select id="role" class="tft-form-control">
                        <option value="admin">Admin</option>
                        <option value="patron">Patron</option>
                        <option value="manager">Manager</option>
                    </select>
                </div>
                <div class="tft-form-group">
                    <label>Statut</label>
                    <select id="is-active" class="tft-form-control">
                        <option value="1">Actif</option>
                        <option value="0">Inactif</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="tft-btn tft-bg-gris" onclick="closeUserModal()">Annuler</button>
                    <button type="submit" class="tft-btn tft-bg-greensav">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/admin-common.js"></script>
    <script src="../assets/js/admin-api.js"></script>
    <script src="../assets/js/admin-users.js"></script>
    <script src="../">
</body>
</html>
