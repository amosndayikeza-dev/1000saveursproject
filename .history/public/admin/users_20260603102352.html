<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs - Admin</title>
    <link rel="icon" href="../assets/images/icons/abonnes.png">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/tft-configStyles.css">
    <link rel="stylesheet" href="../assets/css/responsiveStyles.css">
    <link rel="stylesheet" href="../assets/fonts/feather/feather.css">
    <link rel="stylesheet" href="../assets/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
    <div class="containerAll">
        <!-- Barre latérale -->
        <div class="containerLeft" id="container-left">
            <div class="c-left-header">
                <a href="./dashboard.html">
                    <div class="tft-logo-avatar tft-bdr-greensav-1">
                        <img src="../assets/images/icons/abonnes.png" alt="">
                    </div>
                </a>
                <div class="app-title">
                    <h1 class="app-name">1000<span>Saveurs</span></h1>
                    <p class="tft-title3">Administration</p>
                </div>
            </div>
            <div class="menu">
                <div class="c-left-menu">
                    <a href="./dashboard.html">
                        <div class="c-left-option">
                            <i class="fas fa-home"></i>
                            <p>Dashboard</p>
                        </div>
                    </a>
                    <a href="./users.html">
                        <div class="c-left-option active">
                            <i class="fas fa-users"></i>
                            <p>Utilisateurs</p>
                        </div>
                    </a>
                    <a href="./logs.html">
                        <div class="c-left-option">
                            <i class="fas fa-history"></i>
                            <p>Logs</p>
                        </div>
                    </a>
                    <a href="./settings.html">
                        <div class="c-left-option">
                            <i class="fas fa-cog"></i>
                            <p>Configuration</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Contenu principal -->
        <div class="containerCenter">
            <div class="c-center-header">
                <h2 class="tft-title1">Gestion des utilisateurs</h2>
                <div class="header-aside">
                    <button class="tft-btn tft-bg-greensav" onclick="openUserModal()">
                        <i class="fas fa-plus"></i> Ajouter
                    </button>
                </div>
            </div>
            <div class="c-center-body">
                <div class="admin-users-container">
                    <div class="mgr-toolbar">
                        <div class="tft-form-group">
                            <select id="filter-role" class="tft-form-control">
                                <option value="">Tous les rôles</option>
                                <option value="admin">Admin</option>
                                <option value="patron">Patron</option>
                                <option value="manager">Manager</option>
                            </select>
                        </div>
                        <div class="tft-form-group">
                            <select id="filter-active" class="tft-form-control">
                                <option value="">Tous</option>
                                <option value="1">Actifs</option>
                                <option value="0">Inactifs</option>
                            </select>
                        </div>
                        <button class="tft-btn tft-bg-gris" onclick="loadUsers()">
                            <i class="fas fa-filter"></i> Filtrer
                        </button>
                    </div>

                    <table class="tft-table">
                        <thead>
                            <tr class="tft-b-bottom-gris">
                                <th class="tft-title3">ID</th>
                                <th class="tft-title3">Nom</th>
                                <th class="tft-title3">Prénom</th>
                                <th class="tft-title3">Email</th>
                                <th class="tft-title3">Rôle</th>
                                <th class="tft-title3">Statut</th>
                                <th class="tft-title3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr><td colspan="7" class="mgr-empty-hint">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modale d'ajout/modification -->
    <div id="user-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3 id="modal-title">Ajouter un utilisateur</h3>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="tft-form-group">
                    <label>Nom</label>
                    <input type="text" id="last-name" class="tft-form-control" required>
                </div>
                <div class="tft-form-group">
                    <label>Prénom</label>
                    <input type="text" id="first-name" class="tft-form-control" required>
                </div>
                <div class="tft-form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="tft-form-control" required>
                </div>
                <div class="tft-form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" class="tft-form-control" placeholder="Laisser vide pour ne pas changer">
                </div>
                <div class="tft-form-group">
                    <label>Rôle</label>
                    <select id="role" class="tft-form-control">
                        <option value="admin">Admin</option>
                        <option value="patron">Patron</option>
                        <option value="manager">Manager</option>
                    </select>
                </div>
                <div class="tft-form-group">
                    <label>Statut</label>
                    <select id="is-active" class="tft-form-control">
                        <option value="1">Actif</option>
                        <option value="0">Inactif</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="tft-btn tft-bg-gris" onclick="closeUserModal()">Annuler</button>
                    <button type="submit" class="tft-btn tft-bg-greensav">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/admin-api.js"></script>
    <script src="../assets/js/admin-users.js"></script>
</body>
</html>
