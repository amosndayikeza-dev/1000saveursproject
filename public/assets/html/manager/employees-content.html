<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width = device-width, initial-scale = 1.0">
        <title>1000saveurs</title>
        <link rel="stylesheet" href="../../css/manager.css">
        <link rel="stylesheet" href="../../css/big.css">
        <link rel="stylesheet" href="../../css/styles.css">
        <link rel="stylesheet" href="../../css/responsiveStyles.css">
        <link rel="stylesheet" href="../../fonts/feather/feather.css">
        <link rel="stylesheet" href="../../font-awesome/css/all.min.css">
        <link rel="stylesheet" href="../../css/tft-configStyles.css">
    </head>
    <body>
        <div class="containerAll">
            <!-- partie gauche debut-->
            <div class="containerLeft" id="container-left">
                <div class="tft-icon-round-petit tft-p-absolute tft-top-5 tft-right-10 tft-bg-black3" onclick="hideSidebar()" id="icon-sidebar">
                    <i class="fas fa-arrow-right"></i>
                </div>
                <div class="c-left-header">
                    <a href="./dashboardmanager.html">
                        <div class="tft-logo-avatar tft-bdr-greensav-1">
                            <img src="../../images/icons/abonnes.png" alt="">
                        </div>
                    </a>
                    <div class="app-title">
                        <h1 class="app-name">1000<span>Saveurs</span></h1>
                        <p class="tft-title3">Nom du departement</p>
                    </div>
                </div>
                <div class="menu">
                    <div class="c-left-menu">
                        <a href="./dashboardmanager.html">
                            <div class="c-left-option">
                                <div class="tft-icon-round" onclick="showSidebar()">
                                    <i class="fas fa-home"></i>
                                </div>
                                <p class="option-name">Dashboard</p>
                            </div>
                        </a>
                        <a href="./salesmanager.html">
                            <div class="c-left-option">
                                <div class="tft-icon-round">
                                    <i class="fas fa-shopping-cart"></i>
                                </div>
                                <p class="option-name">Ventes</p>
                            </div>
                        </a>
                        <div class="repport">
                            <div class="c-left-option tft-br-5-5-0-0 tft-p-relative">
                                <div class="tft-icon-round">
                                    <i class="fas fa-chart-bar"></i>
                                </div>
                                <p class="option-name">Rapports</p>
                                <div class="tft-chevron-icon tft-p-absolute tft-top-15 tft-right-5" onclick="showRepportOptions()">
                                    <i class="fas fa-chevron-down tft-clr-gris1"></i>
                                </div>
                            </div>
                            <div class="repport-options" id="repport-options">
                                <a href="./salesmanager.html" class="repport-title tft-hover-greensav">
                                    <div class="tft-icon-round-petit tft-bdr-greensav-1">
                                        <i class="fas fa-chart-bar tft-clr-greensav"></i>
                                    </div>
                                    <p class="tft-title4">Ventes</p>
                                </a>
                                <a href="./repportdebtsmanager.html" class="repport-title">
                                    <div class="tft-icon-round-petit tft-bdr-greensav-1">
                                        <i class="fas fa-chart-bar tft-clr-greensav"></i>
                                    </div>
                                    <p class="tft-title4">Dettes</p>
                                </a>
                                <a href="./repportsalary.html" class="repport-title">
                                    <div class="tft-icon-round-petit tft-bdr-greensav-1">
                                        <i class="fas fa-chart-bar tft-clr-greensav"></i>
                                    </div>
                                    <p class="tft-title4">Salaires</p>
                                </a>
                            </div>
                        </div>
                        <a href="../manager/employees-content.html">
                            <div class="c-left-option">
                                <div class="tft-icon-round">
                                    <i class="fas fa-users"></i>
                                </div>
                                <p class="option-name">Employés</p>
                            </div>
                        </a>
                        <a href="./productsmanager.html">
                            <div class="c-left-option">
                                <div class="tft-icon-round">
                                    <i class="fas fa-boxes"></i>
                                </div>
                                <p class="option-name">Produits</p>
                            </div>
                        </a>
                        
                        <a href="./stockmanager.html">
                            <div class="c-left-option">
                                <div class="tft-icon-round">
                                    <i class="fas fa-boxes"></i>
                                </div>
                                <p class="option-name">Stock</p>
                            </div>
                        </a>
                        <a href="./debtsmanager.html">
                            <div class="c-left-option">
                                <div class="tft-icon-round">
                                    <i class="fas fa-hand-holding-usd"></i>
                                </div>
                                <p class="option-name">Dettes</p>
                            </div>
                        </a>
                    </div>
                    <div class="user-option">
                        <div class="tft-avatar-profil-petit tft-bdr-orangesav-2 tft-cursor-pointer" onclick="showContainerRight()">
                            <img src="../../images/icons/femme.jpg" alt="">
                        </div>
                        <div class="user-infos">
                            <div class="user-name">
                                <h2 id="userName" class="tft-title4 tft-fw-600"> Chargement</h2>
                                <p id="userRole" class="tft-sm-title1">Manager</p>
                            </div>
                            <div class="tft-icon-carre-moyen tft-bg-black3 tft-transition" onclick="deconnectionModal()">
                                <i class="fe fe-log-out tft-clr-red-bg"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- partie gauche fin-->
            <!--partie droite debut-->
            <div class="tft-div-container tft-flex tft-flex-column tft-gap-10px tft-bg-black2">
                <div class="c-center-header">
                    <h2 class="tft-title1 tft-fw-600 tft-center tft-gap-10px">
                        <div class="tft-icon-carre tft-bdr-gris-1" onclick="showSidebar()">
                            <i class="fas fa-bars"></i>
                        </div>
                        Employés du département</h2>
                    <div class="header-aside">
                        <div class="tft-search-withIcon">
                            <input type="search" placeholder="Rechercher" class="tft-clr-white3">
                            <div class="tft-search-withIcon-icon tft-bg-greensav">
                                <i class="fas fa-search tft-clr-remain-white tft-fw-600"></i>
                            </div>
                        </div>
                        <div class="tft-icon-carre-moyen tft-bdr-greensav-1 tft-bg-black3" onclick="showContainerRightNotification()">
                            <i class="fas fa-bell tft-clr-greensav"></i>
                        </div>
                        <div class="tft-icon-carre-moyen tft-bdr-greensav-1 tft-bg-black3"  onclick="showContainerRightParametre()">
                            <i class="fas fa-cog tft-clr-greensav"></i>
                        </div>
                        <div class="tft-icon-carre-moyen tft-bg-orangesav2" id="btn-light-mode" onclick="changeMode()">
                            <i class="fas fa-moon tft-clr-white"></i>
                        </div>
                        <div class="tft-icon-carre-moyen tft-bg-orangesav2 tft-hidden" id="btn-dark-mode" onclick="changeMode()">
                            <i class="fas fa-moon tft-clr-white"></i>
                        </div>
                    </div>
                </div>
                <div class="products-header tft-p-10">
                    <button id="filterButton" class="tft-btn tft-bg-greensav tft-clr-remain-white tft-p-relative" onmouseenter="showFilterOptions()">
                        Filtrer<i class="fas fa-stream"></i>
                        <div class="tft-filters tft-p-absolute" id="filter-options" onmouseenter="showFilterOptions()" onmouseleave="hideFilterOptions()">
                            <!-- La liste des départements sera chargée dynamiquement ici -->
                        </div>
                    </button>
                    <button class="tft-btn tft-bdr-greensav-1 tft-clr-white3 tft-hover-greensav" onclick="ajouterProduct()">
                        <i class="fas fa-add"></i>ajouter un produit
                    </button>
                </div>
                <!--<div class="employees-container">
                    <table class="tft-table" id="employees-table">
                        <thead>
                            <tr>
                                <th>Prénom</th>
                                <th>Nom</th>
                                <th>Email</th>
                                <th>Téléphone</th>
                                <th>Poste</th>
                                <th>Date d'embauche</th>
                                <th>Salaire</th>
                            </tr>
                        </thead>
                        <tbody id="employees-table-body">
                            <tr><td colspan="7" class="mgr-empty-hint">Chargement…</td></tr>
                        </tbody>
                    </table>
                    <div id="employees-pagination" class="pagination-controls" style="margin-top: 20px; text-align: center;"></div>
                </div>-->
                <div class="employees-container">
                    <table class="tft-table" id="un">
                        <thead>
                            <tr class="tft-b-bottom-gris">
                                <th class="tft-title3 tft-bg-black1">
                                    <div class="tft-checkbox tft-bg-remain-white3 tft-bdr-white-1" onclick="activeCheckboxAll(this)">
                                        <i class="fas fa-check tft-clr-transparent "></i>
                                    </div>
                                </th>
                                <th class="tft-title3 tft-bg-black1">Prénom</th>
                                <th class="tft-title3 tft-bg-black1">Nom</th>
                                <th class="tft-title3 tft-bg-black1">Email</th>
                                <th class="tft-title3 tft-bg-black1">Téléphone</th>
                                <th class="tft-title3 tft-bg-black1">Poste</th>
                                <th class="tft-title3 tft-bg-black1">Date d'embauche</th>
                                <th class="tft-title3 tft-bg-black1">Salaire</th>
                            </tr>
                        </thead>
                        <tbody id="employees-table-body">
                            <tr><td colspan="7" class="mgr-empty-hint">Chargement…</td></tr>
                            <!-- Les employes seront places ici -->
                        </tbody>
                    </table>
                    <div class="tft-pagination" id="employees-pagination">
                        <div class="tft-icon-round-moyen tft-bdr-greensav-1 tft-hover-greensav" onclick="prevPage()">
                            <i class="fas fa-arrow-left tft-color-white"></i>
                        </div>
                        <ul class="tft-page-numbers">
                            <!-- Les numéros de page seront générés dynamiquement -->
                        </ul>
                        <div class="tft-icon-round-moyen tft-bdr-greensav-1 tft-hover-greensav" onclick="nextPage()">
                            <i class="fas fa-arrow-right tft-color-white"></i>
                        </div>
                    </div>
                </div>
            </div>
            <!--partie droite fin-->
        </div>
        <script src="../../js/scripts.js"></script>
        <script src="../../js/manager-ui.js"></script>
    </body>
</html>
